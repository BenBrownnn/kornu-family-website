:24,bio:"Following in her uncle Kwame's footsteps, Efua is a dedicated pediatric nurse. She is known for her gentle care and bright smile that comforts patients.",image:"/images/members/efua.jpg",generation:3,birthDate:"2000-06-08",location:"Accra, Ghana",occupation:"Pediatric Nurse",tags:["Nurse","Caregiver","Compassionate"]}],Df=[{id:"1",title:"Kornu Annual Family Reunion 2025",date:"2025-08-15",location:"Accra, Ghana – Family Compound",description:"Our most cherished gathering of the year! All family members are invited to join us for three days of food, music, storytelling, and celebration of the Kornu legacy.",type:"reunion",image:"/images/family-gathering.jpg",rsvpCount:67},{id:"2",title:"Elder Kweku's 79th Birthday Celebration",date:"2025-03-15",location:"Accra, Ghana",description:"Help us celebrate our beloved patriarch as he turns 79! Join us for a special dinner, speeches, and a surprise ceremony in his honor.",type:"birthday",rsvpCount:43},{id:"3",title:`Akua's Art Exhibition: "Roots & Wings"`,date:"2025-05-20",location:"National Museum, Accra",description:"Our talented granddaughter Akua Kornu opens her first solo exhibition in Ghana. Come celebrate her achievements and be inspired by her magnificent artwork.",type:"celebration",rsvpCount:28},{id:"4",title:"Kornu Christmas Dinner 2025",date:"2025-12-25",location:"Accra, Ghana – Family Compound",description:"The most magical night of the year — family, faith, and feasting! Mama Abena will prepare her legendary recipes. Live music by the Kornu Band.",type:"celebration",image:"/images/gallery1.jpg",rsvpCount:54},{id:"5",title:"Remembrance Day – Grandpa Osei Kornu",date:"2025-09-10",location:"Kornu Family Cemetery, Accra",description:"Annual memorial gathering to honor the memory of our late grandfather Osei Kornu. A time for reflection, prayer, and sharing cherished memories.",type:"memorial",rsvpCount:35}],Mf=[{id:"1",title:"The Day Grandfather Kweku Walked 40 Miles for Love",author:"Kofi Kornu",date:"2024-12-01",excerpt:"Long before cars were common in our village, grandfather Kweku walked from Kumasi to Accra — 40 miles on foot — just to ask grandmother Abena's father for her hand in marriage.",content:`Long before cars were common in our village, grandfather Kweku walked from Kumasi to Accra — 40 miles on foot — just to ask grandmother Abena's father for her hand in marriage.

It was the rainy season of 1968. He had saved for three months to buy fabric for a proper outfit. When he finally arrived, covered in mud but standing tall, Grandma Abena's father looked at him and said: "Any man who walks 40 miles for my daughter deserves her."

That evening, they sat under the great mango tree and grandfather told grandmother about his dream: to build a family that would stand for generations. A family of love, dignity, and service.

Today, that dream lives in every one of us. The Kornu family is his greatest masterpiece.`,image:"/images/family-tree.jpg",likes:48,comments:12,tags:["Heritage","Love Story","Grandfather"]},{id:"2",title:"How Mama Abena's Garden Saved the Village",author:"Ama Kornu-Mensah",date:"2024-10-15",excerpt:"In 1984, when drought devastated crops across the region, Mama Abena's medicinal garden became the village's lifeline. Her knowledge of plants and healing fed and healed dozens of families.",content:`In 1984, when drought devastated crops across the region, Mama Abena's medicinal garden became the village's lifeline.

What most people didn't know was that for years, our grandmother had quietly cultivated an extensive garden of both food plants and medicinal herbs. She learned from her own grandmother, who was a well-known healer.

During those difficult months, she shared her harvest freely. She prepared traditional medicines for the sick and taught young women which plants were safe to eat. The village elders still talk about it.

"Abena's garden didn't just grow plants," one elder told me recently. "It grew hope."`,image:"/images/gallery3.jpg",likes:62,comments:18,tags:["Heritage","Grandmother","Resilience"]},{id:"3",title:"Growing Up Kornu: Lessons from the Family Table",author:"Kwame Kornu",date:"2024-09-05",excerpt:"Every Sunday, no matter where any of us were in the city, we came home. The family table was sacred — a place where problems were solved, laughter was loud, and food was always plenty.",content:`Every Sunday, no matter where any of us were in the city, we came home.

Dad would announce at exactly 1pm: "Food is ready!" And somehow, no matter the traffic or the distance, everyone appeared. It was almost magical.

The table was where I learned to listen. Where my sister Ama learned to debate. Where Kofi learned to lead. Father sat at the head, Mother at the other end, and the rest of us filled every chair.

We didn't have smartphones then. We had each other, and stories, and laughter that could be heard from the street.

Those Sundays built me. They built all of us. And I carry that table wherever I go.`,image:"/images/gallery2.jpg",likes:71,comments:24,tags:["Memories","Food","Family Values"]}],Zk=[{id:"1",src:"/images/memory1.webp",title:"Family Reunion 1995",date:"August 1995",category:"Reunions",description:"Our beautiful annual family gathering in Tema"},{id:"2",src:"/images/mom.jpg",title:"Sunday Family Portrait",date:"December 2023",category:"Portraits",description:"Three generations together in the family compound"},{id:"3",src:"/images/family-tree.jpg",title:"Grandparents & Grandchildren",date:"June 2023",category:"Portraits",description:"Elder Kweku with his beloved grandchildren"},{id:"4",src:"/images/gallery1.jpg",title:"Christmas 2023",date:"December 2023",category:"Celebrations",description:"Festive celebrations at the family compound"},{id:"5",src:"/images/gallery2.jpg",title:"Family Adventure",date:"July 2023",category:"Adventures",description:"The Kornu family exploring the beautiful outdoors"},{id:"6",src:"/images/gallery3.jpg",title:"Cooking with Mama",date:"March 2024",category:"Traditions",description:"Passing down traditional recipes to the next generation"}];function $v(){const{setCurrentPage:n,rsvpedEvents:e,toggleRSVP:i,isAuthenticated:r}=kn(),[o,c]=B.useState([]);B.useEffect(()=>{(async()=>{const{data:E,error:C}=await Ae.from("events").select("*").order("date",{ascending:!0});!C&&E&&c(E)})()},[]);const u=[...o,...Df],m=j=>{if(!r){n("signin"),window.scrollTo({top:0,behavior:"smooth"});return}i(j)},g=j=>{n(j),window.scrollTo({top:0,behavior:"smooth"})},p=[{label:"Family Members",value:"47+",icon:rs},{label:"Years Together",value:"100+",icon:yi},{label:"Countries",value:"5",icon:Na},{label:"Generations",value:"4",icon:wb}],y=j=>new Date(j).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),b={reunion:"bg-orange-100 text-orange-700",birthday:"bg-pink-100 text-pink-700",celebration:"bg-purple-100 text-purple-700",memorial:"bg-blue-100 text-b
